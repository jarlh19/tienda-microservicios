name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar y correr las pruebas de los cinco servicios
        run: mvn -B verify

  imagenes:
    name: Construir imágenes Docker
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir las imágenes de docker-compose
        run: docker compose build
