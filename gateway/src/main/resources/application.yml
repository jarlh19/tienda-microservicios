spring:
  application:
    name: gateway
  config:
    # Las rutas viven en config-repo/gateway.yml y llegan desde el Config Server.
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 1500
        max-interval: 5000
