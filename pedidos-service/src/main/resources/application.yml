spring:
  application:
    name: pedidos-service
  config:
    # Las URLs de inventario y pagos, los timeouts y el circuit breaker llegan desde
    # config-repo/pedidos-service.yml.
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 1500
        max-interval: 5000
